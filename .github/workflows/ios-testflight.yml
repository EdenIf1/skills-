# Builds the Blockfire iPhone app in the cloud and uploads it to TestFlight / App Store Connect.
# Runs when you push a tag like ios-v1.0.0, or from the Actions tab ("Run workflow").
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID              your 10-character Apple Developer Team ID
#   ASC_KEY_ID                 App Store Connect API key ID
#   ASC_ISSUER_ID              App Store Connect API issuer ID
#   ASC_PRIVATE_KEY            the contents of the AuthKey_XXXX.p8 file
# Signing is automatic: Xcode creates the certificate and profile with the API key, no Mac needed.
name: iOS · TestFlight
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']
concurrency: { group: ios-testflight, cancel-in-progress: false }
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults: { run: { working-directory: blockfire/app } }
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: blockfire/app/package-lock.json }
      - name: Check the secrets are set
        run: |
          for v in TEAM KEY_ID ISSUER; do [ -n "${!v}" ] || { echo "::error::Secret for $v is missing. See the top of this file."; exit 1; }; done
      - run: npm ci
      - name: Build the game for the app
        run: npm run www && npx cap sync ios
      - name: App Store Connect key
        env: { P8: '${{ secrets.ASC_PRIVATE_KEY }}' }
        run: |
          mkdir -p "$RUNNER_TEMP/keys" && printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "AUTH=-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Blockfire.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} $AUTH -quiet
      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Blockfire.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" $AUTH
      - name: Done
        run: echo "Build ${{ github.run_number }} is on its way to TestFlight. It shows up in App Store Connect in about 10-30 minutes."
