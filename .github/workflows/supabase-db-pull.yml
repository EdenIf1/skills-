# Manual pull of the live Cubefront schema into blockfire/supabase/migrations/.
# Does not run on push, so a missing secret does not fail other CI.
# Does not edit schema.sql or identity.sql, and does not print the token or the database password.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    Dashboard → project blockfire → Project Settings → Database
# The project ref is public (qnhogbwnumvounwpusmc) and is the script default.
name: Supabase schema pull
on:
  workflow_dispatch:
    inputs:
      mark_applied:
        description: "Record the new migration as already applied on the live database (one history row). Leave false until the SQL has been reviewed."
        type: boolean
        default: false
      commit:
        description: "Commit new migration files to the branch this workflow was started on."
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: supabase-db-pull
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: qnhogbwnumvounwpusmc
      SUPABASE_DB_PULL_MARK_APPLIED: ${{ inputs.mark_applied == true && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Require secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add repository secret SUPABASE_ACCESS_TOKEN (https://supabase.com/dashboard/account/tokens). Do not paste it into the workflow."
            exit 2
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add repository secret SUPABASE_DB_PASSWORD (Dashboard → Project Settings → Database). Do not paste it into the workflow."
            exit 2
          fi
          echo "Secrets are present. Values are not printed. Project ref: $SUPABASE_PROJECT_REF"
      - name: Pull schema
        run: bash blockfire/supabase/db-pull.sh
      - name: Upload migration files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migrations
          path: blockfire/supabase/migrations/*.sql
          if-no-files-found: ignore
      - name: Commit migration files
        if: inputs.commit == true && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blockfire/supabase/migrations/*.sql
          if git diff --cached --quiet; then
            echo "No new migration SQL to commit."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Add live Supabase schema migration"
          git push
