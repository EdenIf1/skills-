# Nightly backup of the Cubefront database (accounts' game progress, reports, settings).
# The free Supabase plan keeps no downloadable backups, so this job makes one every night and keeps it for 30 days
# as an encrypted file attached to the run (Actions → Supabase backup → a run → Artifacts).
#
# It does nothing until the owner adds two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     the database connection string (Supabase dashboard → Connect → "Session pooler" URI, with the password)
#   BACKUP_PASSPHRASE   a long passphrase of your choice; keep it in your password manager. Without it the backup cannot be opened.
# Restore: gpg -d backup.sql.gz.gpg | gunzip > backup.sql, then load it with psql into a database.
name: Supabase backup
on:
  schedule:
    - cron: '41 2 * * *'   # every night at 02:41 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB: ${{ secrets.SUPABASE_DB_URL }}
      PASS: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        id: ok
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then echo "Backup secrets are not set yet: nothing to do."; echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: Install the database tools
        if: steps.ok.outputs.go == '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Dump, compress and encrypt
        if: steps.ok.outputs.go == '1'
        run: |
          set -o pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --no-owner --no-privileges \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 -o backup.sql.gz.gpg 3<<<"$PASS"
          ls -l backup.sql.gz.gpg
      - name: Keep it for 30 days
        if: steps.ok.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: cubefront-db-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 30
