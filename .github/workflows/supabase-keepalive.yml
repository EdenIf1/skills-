# Keeps the Cubefront database (Supabase, free plan) awake.
# A free project is paused after about a week without database activity; this job makes one tiny write every day
# (it updates a single timestamp row through the keepalive() function), so the game's server never goes to sleep.
# The key below is the public "anon" key that is already inside the game; it can only call keepalive().
# Scheduled jobs only run from the default branch, which is why this file lives on main.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:
permissions:
  actions: write   # lets the job keep its own schedule switched on (GitHub turns schedules off after 60 quiet days)
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://qnhogbwnumvounwpusmc.supabase.co/rest/v1/rpc/keepalive
      ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuaG9nYndudW12b3Vud3B1c21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NzYyNzQsImV4cCI6MjEwNzI1MjI3NH0.8c16Bx4eagKtW8Usp0bRXNmxXRW0I3zZ_jjpZJy6kyI
    steps:
      - name: Wake the database
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o out.txt -w '%{http_code}' -X POST "$URL" -H "apikey: $ANON" -H "Content-Type: application/json" -d '{}')
            echo "try $i: HTTP $code $(cat out.txt)"
            [ "$code" = 200 ] && exit 0
            sleep 20
          done
          echo "::error::The database did not answer. If it was paused, open supabase.com/dashboard and press Restore."
          exit 1
      - name: Keep this schedule switched on
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable" || true
